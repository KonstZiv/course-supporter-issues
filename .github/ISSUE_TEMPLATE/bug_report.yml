name: "🛠️ Повідомити про проблему"
description: "Щось не натискається, поїхав дизайн або функція працює неправильно? Напишіть нам тут."
title: "[Проблема]: "
labels: ["bug", "user-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        ### Дякуємо, що допомагаєте зробити платформу кращою! 🙌
        Опишіть проблему своїми словами — не потрібно знати технічні терміни. Найбільше нам допоможе **скріншот** та короткий опис того, що ви намагалися зробити.

  - type: dropdown
    id: user-role
    attributes:
      label: "Ким ви є на платформі?"
      description: "Це допоможе нам одразу зрозуміти, в якому кабінеті шукати проблему."
      options:
        - "👨‍🏫 Викладач / Автор курсу"
        - "🎓 Студент"
        - "👤 Інше (гість / адміністратор)"
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: "З чим саме виникла проблема?"
      options:
        - "🖱️ Кнопка або функція не працює (нічого не відбувається / видає помилку)"
        - "🎨 Проблема з дизайном (поїхав текст, налізли елементи, не видно кнопки)"
        - "🤖 Дивна поведінка при перевірці завдання / роботі ШІ-ментора"
        - "📹 Проблема з відео або матеріалами уроку"
        - "🔐 Вхід / Реєстрація / Профіль"
        - "❓ Інше"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Що ви робили і що пішло не так?"
      description: "Опишіть ситуацію простими словами: куди зайшли, на що натиснули і що сталося (або не сталося)."
      placeholder: |
        Наприклад: Я зайшов у 2-й урок курсу Python, вставив розв'язок у поле для домашнього завдання і натиснув кнопку «Відправити». Кнопка крутиться вже 5 хвилин, але нічого не відбувається.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Скріншот або запис екрана (дуже бажано! 📸)"
      description: "Просто скопіюйте скріншот і натисніть Ctrl+V (або Cmd+V на Mac) прямо в це текстове поле — картинка завантажиться сама. Або перетягніть файл мишкою."
      placeholder: "Вставте скріншот сюди..."
    validations:
      required: false

  - type: input
    id: page-url
    attributes:
      label: "Посилання на сторінку (якщо можливо)"
      description: "Скопіюйте адресу з верхнього рядка браузера, де сталася помилка."
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: device
    attributes:
      label: "З якого пристрою ви заходили?"
      description: "Оберіть один або декілька варіантів (це важливо для перевірки верстки)."
      options:
        - label: "💻 Комп'ютер або ноутбук"
        - label: "📱 Смартфон / Планшет"
